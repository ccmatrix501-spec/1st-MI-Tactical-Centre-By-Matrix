<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear Cache</title>
  <style>body{font-family:system-ui;background:#050607;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
  <div>Clearing…</div>
  <script>
    (async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}location.href='./?v='+Date.now()})();
  </script>
</body>
</html>
